# lefthook.yml
#
# Note: les scripts lint de chaque app utilisent ESLint avec un scope fixe
# (ex: "eslint .", "eslint src"). On invoque ESLint directement avec les
# fichiers staged pour eviter ce probleme.
# Note Windows: lefthook est un binaire Go, {staged_files} utilise des
# forward slashes — compatible avec ESLint/Node sur Windows.

pre-commit:
  parallel: true
  jobs:
    # Ignored and unsupported files are skipped; `bun run format` fixes what it reports.
    - name: format
      run: bunx --no-install prettier --check --ignore-unknown {staged_files}

    - name: lint-server
      root: 'apps/server/'
      glob: '**/*.ts'
      run: bunx --no-install eslint --max-warnings 0 --no-warn-ignored {staged_files}

    - name: lint-landing
      root: 'apps/landing/'
      glob: '**/*.{ts,tsx}'
      run: bunx --no-install eslint --max-warnings 0 --no-warn-ignored {staged_files}

    - name: lint-web
      root: 'apps/web/'
      glob: '**/*.{ts,tsx}'
      run: bunx --no-install eslint --max-warnings 0 --no-warn-ignored {staged_files}

    - name: lint-ui
      root: 'packages/ui/'
      glob: '**/*.{ts,tsx}'
      run: bunx --no-install eslint --max-warnings 0 --no-warn-ignored {staged_files}

    # The typed lint of @repo/api reads the server's built declarations
    # (tomai-server/dist/types), which the typecheck run rebuilds first.
    - name: typecheck-then-lint-api
      group:
        piped: true
        jobs:
          - name: typecheck
            run: bunx --no-install turbo run typecheck --affected --output-logs=errors-only

          - name: lint-api
            root: 'packages/api/'
            glob: '**/*.ts'
            run: bunx --no-install eslint --max-warnings 0 --no-warn-ignored {staged_files}

pre-push:
  parallel: true
  jobs:
    - name: test
      run: bunx --no-install turbo run test --affected --output-logs=errors-only

    - name: build
      run: bunx --no-install turbo run build --affected --output-logs=errors-only
