packages:
  - apps/*
  - packages/*

# Supply-chain protection: chaque package qui veut exécuter un build script
# doit être listé explicitement (strictDepBuilds=true par défaut depuis pnpm 11+).
# Tous les packages ici sont des libs officielles/matures qu'on trust pour
# installer leurs binaires natifs.
allowBuilds:
  '@evilmartians/lefthook': true
  '@sentry/cli': true
  esbuild: true
  protobufjs: true
  sharp: true

catalog:
  '@radix-ui/react-slot': ^1.3.3
  '@types/react': ~19.3.0
  '@types/react-dom': ~19.3.0
  class-variance-authority: ^0.7.1
  clsx: ^2.1.1
  eslint: ^10.11.0
  lucide-react: ^1.47.0
  react: ^19.3.0
  react-dom: ^19.3.0
  tailwind-merge: ^3.7.0
  tailwindcss: ^4.3.3
  typescript: 6.0.3

# Supply-chain protection: bloque l'install de packages publiés depuis <24h
# (défaut depuis pnpm 11+).
minimumReleaseAge: 1440

# Migré depuis package.json#pnpm.overrides — depuis pnpm 11+, ce champ "pnpm"
# du package.json n'est plus lu. Toutes les overrides doivent vivre ici.
overrides:
  # GHSA-67mh-4wv8-2f99 (esbuild <0.25.0, dev-server request forwarding), via
  # drizzle-kit>@esbuild-kit/esm-loader>@esbuild-kit/core-utils. Dev-only.
  # Drop once drizzle-kit stops depending on @esbuild-kit.
  '@esbuild-kit/core-utils>esbuild': '>=0.25.0'
