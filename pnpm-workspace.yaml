packages:
  - apps/*
  - packages/*
  # Python-only apps (uv, no package.json) — never real pnpm packages.
  - '!apps/curriculum'
  - '!apps/ai-service'

# pnpm 11 reads these from here, NOT from .npmrc (where they are silently
# ignored). RN 0.85's @react-native/jest-preset needs @babel/generator at
# runtime but doesn't declare it; hoist Babel internals to the root so it
# resolves under pnpm.
publicHoistPattern:
  - '@babel/*'

# Supply-chain protection: chaque package qui veut exécuter un build script
# doit être listé explicitement (pnpm 11 strictDepBuilds=true par défaut).
# Tous les packages ici sont des libs officielles/matures qu'on trust pour
# installer leurs binaires natifs.
allowBuilds:
  '@evilmartians/lefthook': true
  '@sentry/cli': true
  esbuild: true
  protobufjs: true
  sharp: true

catalog:
  '@radix-ui/react-slot': ^1.2.4
  '@types/react': ~19.2.10
  '@types/react-dom': ~19.2.3
  class-variance-authority: ^0.7.1
  clsx: ^2.1.1
  eslint: ^10.4.1
  lucide-react: ^1.17.0
  # Pinned to React 19.2.3 — the version Expo SDK 56 bundles. Keep aligned with
  # the SDK's react pin so expo-doctor stays green and mobile uses one react.
  react: 19.2.3
  react-dom: 19.2.3
  # Keep strictly in sync with `react` (@testing-library/react-native compares them).
  react-test-renderer: 19.2.3
  tailwind-merge: ^3.6.0
  tailwindcss: ^4.3.0
  typescript: 6.0.3

# Supply-chain protection: bloque l'install de packages publiés depuis <24h
# (défaut pnpm 11). Override ciblé pour les libs transitive qu'on connait OK.
minimumReleaseAge: 1440
minimumReleaseAgeExclude:
  - tinyexec
  # Renovate security update: next@16.2.6
  - next@16.2.6

# Migré depuis package.json#pnpm.overrides — pnpm 11 ne lit plus le champ "pnpm"
# du package.json. Toutes les overrides doivent vivre ici.
overrides:
  # Pin a single @types/node across the workspace: hoisted node-linker + multiple
  # resolved versions made RN's global `Response` shadow node/undici's (which has
  # `.body`), breaking mobile typecheck on server source pulled via @repo/api.
  '@types/node': 25.9.1
  # @expo/dom-webview stayed pinned at 55.0.3 in the lock (transitive optional peer of
  # expo, never bumped). Its 55.x Android AAR references expo.modules.kotlin.types.
  # AnyTypeProvider, a class removed by the expo-modules-core 56 type refactor →
  # ClassNotFoundException crashes the app on boot. Force the SDK 56 line.
  '@expo/dom-webview': 56.0.5
  # kysely 0.29 moved DEFAULT_MIGRATION_TABLE/_LOCK_TABLE to the `kysely/migration`
  # entry; better-auth's bundled kysely-adapter still imports them from the root,
  # breaking the bun server build. Known upstream bug, still open:
  # https://github.com/better-auth/better-auth/issues/9610
  # Pin to the latest 0.28.x (last line that re-exports them from root) and drop
  # this override once better-auth ships the fix.
  kysely: 0.28.17
  lightningcss: 1.30.1
  esbuild: '>=0.25.0'
  fast-xml-parser: '>=5.3.8'
  rollup: '>=4.59.0'
  tar: '>=7.5.8'
  qs: '>=6.14.2'
  lodash-es: '>=4.17.23'
  '@isaacs/brace-expansion': '>=5.0.1'
  markdown-it: '>=12.3.2'
  'eslint>minimatch': '>=3.1.4'
  'eslint-plugin-react>minimatch': '>=3.1.4'
  'glob>minimatch': '>=10.2.3'
  '@typescript-eslint/typescript-estree>minimatch': '>=9.0.7'
  'eslint>ajv': '>=6.14.0 <7.0.0'
  'expo-build-properties>ajv': '>=8.18.0'
  hono: '>=4.12.7'
  '@hono/node-server': '>=1.19.10'
  file-type: '>=21.3.1'
  underscore: '>=1.13.8'
  '@tootallnate/once': '>=3.0.1'
  lodash: '>=4.17.23'
  # CVE fixes for transitive deps (GitHub Dependabot alerts). Drop once parents bump.
  uuid: '>=11.1.1'
  postcss: '>=8.5.10'
  brace-expansion: '>=5.0.6'
  # `pnpm audit --prod --audit-level high` fixes (2026-07-06 review). Patch/minor
  # bumps of transitive deps via override; drop once the parent packages bump.
  # @grpc/grpc-js <1.14.4: malformed request/compressed message can crash the
  # process (via @opentelemetry/sdk-node's otlp-grpc exporters).
  '@grpc/grpc-js': '1.14.4'
  # protobufjs <=7.6.0: DoS via unbounded Any expansion during JSON conversion
  # (via @grpc/grpc-js>@grpc/proto-loader). Pinned exact (not >=) — protobufjs
  # 8.x is a major bump @grpc/proto-loader doesn't support yet.
  protobufjs: '7.6.1'
  # undici <6.27.0: WebSocket client DoS via fragment count bypass, via
  # @qdrant/js-client-rest (direct prod dependency of the server).
  '@qdrant/js-client-rest>undici': '6.27.0'
  # undici <7.28.0: TLS bypass in SOCKS5 ProxyAgent, cross-origin request
  # routing, and WebSocket DoS — via jsdom (vitest's DOM shim), test tooling
  # pulled into the prod tree as an optional peer of better-auth (never
  # invoked at runtime).
  'jsdom>undici': '7.28.0'
  # linkify-it <=5.0.0: quadratic complexity DoS in #match, via
  # markdown-it (react-native-markdown-display's parser, mobile prod dep).
  # Pinned exact (not >=), consistent with the other overrides in this block.
  'markdown-it>linkify-it': '5.0.2'

# `pnpm audit` findings tolerated after review (2026-07-06). Validated against
# https://pnpm.io/cli/audit#auditconfigignoreghsas (pnpm 11): since v11, pnpm
# audit filters by GitHub advisory ID (GHSA), not CVE — `auditConfig.ignoreCves`
# is no longer recognized.
auditConfig:
  ignoreGhsas:
    # GHSA-w7jw-789q-3m8p — shell-quote quote() does not escape newlines in
    # object .op values (critical). Chain: react-native>react-devtools-core>
    # shell-quote — react-devtools-core is the RN dev-menu bridge to React
    # DevTools, never bundled/invoked in a production release build. Patched
    # at 1.8.4 but pinned deep inside react-native's own dependency tree (not
    # a direct or easily overridable dep); dev-tooling, non exposé au runtime
    # prod. Reviewed 2026-07-06.
    - GHSA-w7jw-789q-3m8p
