# ============================================================
# TomAI — Docker Compose (infra de développement du monorepo)
# Le serveur et les apps tournent sur l'host : `bun run dev` (à la racine).
# Interface de la base : `bun run db:studio`.
# ============================================================

# Nom de projet Compose figé, indépendant du dossier : évite les conflits de
# conteneurs/volumes quand le compose (ou le dossier) change de nom.
name: tomai

services:
  # ===========================================
  # PostgreSQL 18
  # ===========================================
  postgres:
    image: postgres:18.6
    container_name: tomai-postgres-dev
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: tomai_dev
      POSTGRES_USER: tomai_dev
      POSTGRES_PASSWORD: tomai_dev_password
      # Performance tuning for dev
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    volumes:
      - postgres_dev_data:/var/lib/postgresql
    networks:
      - tomai-dev
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tomai_dev -d tomai_dev"]
      interval: 10s
      timeout: 5s
      retries: 5
    # Performance config pour dev local
    command: >
      postgres
      -c shared_buffers=256MB
      -c effective_cache_size=512MB
      -c max_connections=100

# ===========================================
# Volumes persistants
# ===========================================
volumes:
  postgres_dev_data:
    name: tomai_postgres_dev_data

# ===========================================
# Réseau isolé development
# ===========================================
networks:
  tomai-dev:
    name: tomai-dev-network
    driver: bridge
