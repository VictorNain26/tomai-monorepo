# Composite action: Setup pnpm + Node.js + Bun + Turbo cache + install
# Used by all CI jobs to avoid repeating 5 setup steps

name: Setup Monorepo
description: Install pnpm, Node.js, Bun, restore Turbo cache, and install dependencies

inputs:
  turbo-cache-key:
    description: Suffix for turbo cache key
    required: false
    default: default

runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@fe02b34f77f8bc703788d5817da081398fad1dd2 # v4.0.0
      shell: bash

    - uses: actions/setup-node@49933ea5288caeca8642195f2ed94f1f2b9f8c9e # v4.4.0
      with:
        node-version: "22"
        cache: pnpm

    - uses: oven-sh/setup-bun@735343b667d3e6aacc87c50f1e71b6d5b3bdd658 # v2.0.2
      with:
        bun-version: "1.3"

    - uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
      with:
        path: .turbo
        key: turbo-${{ runner.os }}-${{ inputs.turbo-cache-key }}-${{ github.sha }}
        restore-keys: turbo-${{ runner.os }}-${{ inputs.turbo-cache-key }}-
      shell: bash

    - run: pnpm install --frozen-lockfile
      shell: bash
