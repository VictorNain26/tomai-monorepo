# Composite action: Setup Bun + Node.js + Turbo cache + install
# Used by all CI jobs to avoid repeating 5 setup steps

name: Setup Monorepo
description: Install Bun and Node.js (Next.js builds), restore caches, and install dependencies with bun

inputs:
  turbo-cache-key:
    description: Suffix for turbo cache key
    required: false
    default: default

runs:
  using: composite
  steps:
    - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      with:
        bun-version: "1.4.2"

    # Node stays for the Next.js landing build.
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version-file: .nvmrc

    - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.bun/install/cache
        key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
        restore-keys: bun-${{ runner.os }}-

    - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: .turbo
        key: turbo-${{ runner.os }}-${{ inputs.turbo-cache-key }}-${{ github.sha }}
        restore-keys: turbo-${{ runner.os }}-${{ inputs.turbo-cache-key }}-

    - run: bun install --frozen-lockfile
      shell: bash
