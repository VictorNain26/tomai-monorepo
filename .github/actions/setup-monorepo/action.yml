# Composite action: Bun, Node.js, Bun's download cache and the install, for the jobs on the runner.
# No cache of `.turbo`: a directory per commit, never pruned, hit almost never, it outgrew the
# repository's 10 GB and evicted Bun's (https://docs.github.com/en/actions/reference/workflows-and-actions/dependency-caching).

name: Setup Monorepo
description: Install Bun and Node.js (Astro and Playwright run on it), restore Bun's cache, and install dependencies with bun

runs:
  using: composite
  steps:
    - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      with:
        bun-version-file: package.json

    # Node stays: the astro and playwright binaries run on it.
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version-file: .nvmrc

    - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.bun/install/cache
        key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
        restore-keys: bun-${{ runner.os }}-

    - run: bun install --frozen-lockfile
      shell: bash
