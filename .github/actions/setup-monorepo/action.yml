# Composite action: Setup pnpm + Node.js + Bun + Turbo cache + install
# Used by all CI jobs to avoid repeating 5 setup steps

name: Setup Monorepo
description: Install pnpm, Node.js, Bun, restore Turbo cache, and install dependencies

inputs:
  turbo-cache-key:
    description: Suffix for turbo cache key
    required: false
    default: default

runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@41ff72655975bd51cab0327fa583b6e92b6d3061 # v4.2.0

    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
      with:
        node-version: "22"
        cache: pnpm

    - uses: oven-sh/setup-bun@3d267786b128fe76c2f16a390aa2448b815359f3 # v2.1.2
      with:
        bun-version: "1.3"

    - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: .turbo
        key: turbo-${{ runner.os }}-${{ inputs.turbo-cache-key }}-${{ github.sha }}
        restore-keys: turbo-${{ runner.os }}-${{ inputs.turbo-cache-key }}-

    - run: pnpm install --frozen-lockfile
      shell: bash
