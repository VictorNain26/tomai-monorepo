# Composite action: Setup pnpm + Node.js + Bun + Turbo cache + install
# Used by all CI jobs to avoid repeating 5 setup steps

name: Setup Monorepo
description: Install pnpm, Node.js, Bun, restore Turbo cache, and install dependencies

inputs:
  turbo-cache-key:
    description: Suffix for turbo cache key
    required: false
    default: default

runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version-file: .nvmrc
        cache: pnpm

    - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      with:
        bun-version: "1.3"

    - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: .turbo
        key: turbo-${{ runner.os }}-${{ inputs.turbo-cache-key }}-${{ github.sha }}
        restore-keys: turbo-${{ runner.os }}-${{ inputs.turbo-cache-key }}-

    - run: pnpm install --frozen-lockfile
      shell: bash
