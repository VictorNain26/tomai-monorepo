# Dependabot: automated dependency updates
# PRs target staging, auto-merged for patch/minor (see auto-merge.yml)

version: 2

updates:
  # pnpm dependencies
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Europe/Paris
    open-pull-requests-limit: 10
    target-branch: staging
    labels:
      - dependencies
    commit-message:
      prefix: deps
    groups:
      minor-and-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  # GitHub Actions
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Europe/Paris
    open-pull-requests-limit: 5
    target-branch: staging
    labels:
      - ci
    commit-message:
      prefix: ci
    groups:
      github-actions:
        patterns:
          - "*"

  # Docker base images
  - package-ecosystem: docker
    directory: /apps/server
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Europe/Paris
    open-pull-requests-limit: 3
    target-branch: staging
    labels:
      - docker
    commit-message:
      prefix: docker
