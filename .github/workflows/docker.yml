# TomAI - Docker build check (server)
# Vérifie que l'image production du backend builde réellement — attrape les
# références mortes (ex: package retiré du workspace mais encore COPY).
# L'image embarque le build de apps/web, que le serveur sert sur son origine.

name: Docker

on:
  push:
    branches: [main]
    paths:
      - 'apps/server/**'
      - 'apps/web/**'
      - 'packages/tokens/**'
      - 'packages/web-host/**'
      - 'packages/eslint-config/**'
      - 'bun.lock'
      - 'bunfig.toml'
      - 'package.json'
      - '.dockerignore'
      - 'tsconfig.base.json'
      - '.github/workflows/docker.yml'
  pull_request:
    branches: [main]
    paths:
      - 'apps/server/**'
      - 'apps/web/**'
      - 'packages/tokens/**'
      - 'packages/web-host/**'
      - 'packages/eslint-config/**'
      - 'bun.lock'
      - 'bunfig.toml'
      - 'package.json'
      - '.dockerignore'
      - 'tsconfig.base.json'
      - '.github/workflows/docker.yml'

permissions:
  contents: read

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-server:
    name: Build server production image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build production image
        run: docker build --target production -f apps/server/Dockerfile .
