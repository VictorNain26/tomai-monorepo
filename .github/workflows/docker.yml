# TomAI - Docker build check (server + ai-service)
# Vérifie que les images production du backend et du service IA buildent
# réellement — attrape les références mortes (ex: package retiré du workspace
# mais encore COPY).

name: Docker

on:
  push:
    branches: [main]
    paths:
      - 'apps/server/**'
      - 'apps/ai-service/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'package.json'
      - '.npmrc'
      - 'tsconfig.base.json'
      - '.github/workflows/docker.yml'
  pull_request:
    branches: [main]
    paths:
      - 'apps/server/**'
      - 'apps/ai-service/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'package.json'
      - '.npmrc'
      - 'tsconfig.base.json'
      - '.github/workflows/docker.yml'

permissions:
  contents: read

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-server:
    name: Build server production image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Build production image
        run: docker build --target production -f apps/server/Dockerfile .

  build-ai-service:
    name: Build ai-service image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Build ai-service image
        run: docker build -f apps/ai-service/Dockerfile apps/ai-service
