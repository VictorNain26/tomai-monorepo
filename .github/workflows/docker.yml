# TomAI - Docker build check (server)
# Vérifie que l'image production du backend build réellement — attrape les
# références mortes (ex: package retiré du workspace mais encore COPY).

name: Docker

on:
  push:
    branches: [main]
    paths:
      - 'apps/server/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'package.json'
      - '.npmrc'
      - 'tsconfig.base.json'
      - '.github/workflows/docker.yml'
  pull_request:
    branches: [main]
    paths:
      - 'apps/server/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'package.json'
      - '.npmrc'
      - 'tsconfig.base.json'
      - '.github/workflows/docker.yml'

permissions:
  contents: read

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-server:
    name: Build server production image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Build production image
        run: docker build --target production -f apps/server/Dockerfile .
