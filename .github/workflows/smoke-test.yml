name: Smoke test (post-deploy)

on:
  push:
    branches: [main]

jobs:
  wait-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Wait for THIS commit to be live and healthy
        run: |
          for i in $(seq 1 40); do
            sleep 30
            body=$(curl -sS https://api.tomia.fr/health || true)
            commit=$(echo "$body" | jq -r '.commit // "unreachable"' 2>/dev/null || echo "unreachable")
            status=$(echo "$body" | jq -r '.status // "unreachable"' 2>/dev/null || echo "unreachable")
            echo "attempt $i/40: commit=$commit status=$status (want ${GITHUB_SHA} healthy)"
            if [ "$commit" = "unknown" ]; then
              echo "::error::deployed commit is 'unknown' — Koyeb build is missing --build-arg GIT_COMMIT_SHA=\$GITHUB_SHA, configure it in the Koyeb build settings"
              exit 1
            fi
            if [ "$commit" = "${GITHUB_SHA}" ] && [ "$status" = "healthy" ]; then
              echo "✅ deployed commit is live and fully healthy"; exit 0
            fi
            if [ "$commit" = "${GITHUB_SHA}" ] && [ "$status" != "healthy" ]; then
              echo "::error::new version live but $status"; echo "$body" | jq .; exit 1
            fi
          done
          echo "::error::commit ${GITHUB_SHA} never became live+healthy in 20min"; exit 1
