# TomAI Monorepo - CI Pipeline
# Validates code quality on push and PRs
# Turbo handles parallelism across apps (server, landing, mobile)

name: CI

on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3'

      - name: Turbo Cache
        uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: TypeScript
        run: pnpm run typecheck

      - name: ESLint
        run: pnpm run lint

      - name: Tests
        run: pnpm run test
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Build
        run: pnpm run build

  migrations:
    name: Migration Sync Check
    runs-on: ubuntu-latest
    # Parallel with validate — no DB connection needed, fast check

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check migrations in sync with schema
        working-directory: apps/server
        run: |
          bun run db:generate
          if [ -n "$(git diff --name-only drizzle/)" ]; then
            echo "::error::Schema et migrations désynchronisés ! Exécute 'cd apps/server && bun run db:generate' puis commite les fichiers générés."
            git diff drizzle/
            exit 1
          fi
          echo "Migrations en sync avec schema.ts"
