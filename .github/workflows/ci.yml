# TomAI Monorepo - CI Pipeline
# Path-filtered, parallelized, SHA-pinned (2026 best practices)

name: CI

on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # =============================================
  # Job 1: Detect changed apps (< 10 seconds)
  # =============================================
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      server: ${{ steps.filter.outputs.server }}
      landing: ${{ steps.filter.outputs.landing }}
      mobile: ${{ steps.filter.outputs.mobile }}
      packages: ${{ steps.filter.outputs.packages }}
      any: ${{ steps.filter.outputs.server == 'true' || steps.filter.outputs.landing == 'true' || steps.filter.outputs.mobile == 'true' || steps.filter.outputs.packages == 'true' || steps.filter.outputs.ci == 'true' }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dorny/paths-filter@de90cc6fb38fc0963ad72b210f1f284cd68cea36 # v3.0.2
        id: filter
        with:
          filters: |
            server:
              - 'apps/server/**'
              - 'packages/**'
              - 'pnpm-lock.yaml'
            landing:
              - 'apps/landing/**'
              - 'packages/**'
              - 'pnpm-lock.yaml'
            mobile:
              - 'apps/mobile/**'
              - 'packages/**'
              - 'pnpm-lock.yaml'
            packages:
              - 'packages/**'
            ci:
              - '.github/**'
              - 'turbo.json'
              - 'tsconfig.base.json'

  # =============================================
  # Job 2: Typecheck + Lint (parallel matrix)
  # =============================================
  validate:
    name: ${{ matrix.task }}
    needs: changes
    if: needs.changes.outputs.any == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        task: [typecheck, lint]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: ./.github/actions/setup-monorepo
        with:
          turbo-cache-key: ${{ matrix.task }}
      - run: pnpm run ${{ matrix.task }}

  # =============================================
  # Job 3: Tests (parallel with validate)
  # =============================================
  test:
    name: Test
    needs: changes
    if: needs.changes.outputs.server == 'true' || needs.changes.outputs.packages == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: ./.github/actions/setup-monorepo
        with:
          turbo-cache-key: test
      - run: pnpm run test
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

  # =============================================
  # Job 4: Build (after validate passes)
  # =============================================
  build:
    name: Build
    needs: [changes, validate]
    if: needs.changes.outputs.server == 'true' || needs.changes.outputs.landing == 'true' || needs.changes.outputs.packages == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: ./.github/actions/setup-monorepo
        with:
          turbo-cache-key: build
      - run: pnpm run build

  # =============================================
  # Job 5: Migration sync (parallel, server only)
  # =============================================
  migrations:
    name: Migration Sync
    needs: changes
    if: needs.changes.outputs.server == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: ./.github/actions/setup-monorepo
        with:
          turbo-cache-key: migrations
      - name: Check migrations in sync with schema
        working-directory: apps/server
        run: |
          bun run db:generate
          if [ -n "$(git diff --name-only drizzle/)" ]; then
            echo "::error::Schema et migrations desynchronises ! Execute 'cd apps/server && bun run db:generate' puis commite les fichiers generes."
            git diff drizzle/
            exit 1
          fi
          echo "Migrations en sync avec schema.ts"
