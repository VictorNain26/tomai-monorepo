# One pipeline: every check of the repository, in parallel jobs, gathered by `ci-ok`, the one
# check the ruleset requires. On a PR, turbo `--affected` picks the tasks; on main, all run.
# Actions pinned by SHA.

name: CI

# No paths-ignore: `ci-ok` must report on every PR, or the ruleset blocks its merge, and every
# commit on main gets its image. Every PR, whatever its base: in a cascade, each PR targets the
# branch before it, and the run on its head still counts once it is retargeted on main.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A new push cancels a PR's run; on main, each merge's run goes on to publish its image.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  TURBO_SCM_BASE: origin/main
  # The PR runs what it affects, main runs everything.
  AFFECTED: ${{ github.event_name == 'pull_request' && '--affected' || '' }}

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-monorepo
      - run: bunx --no-install turbo run typecheck lint ${AFFECTED:+"$AFFECTED"}
      - run: bunx --no-install prettier --check .
      - run: bunx --no-install knip
      # Version-pinned, as its README asks (https://github.com/QuiiBz/sherif).
      - run: npx sherif@1.13.0

  actionlint:
    name: Actionlint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Docker image method of https://github.com/rhysd/actionlint/blob/main/docs/usage.md.
      - uses: docker://rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
        with:
          args: -color

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The server's tests run on a real Postgres: a database per test file, copied from this run's
    # template (apps/server/src/testing).
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-monorepo
      - run: bunx --no-install turbo run test ${AFFECTED:+"$AFFECTED"}
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-monorepo
      - run: bunx --no-install turbo run build ${AFFECTED:+"$AFFECTED"}

  # The web's suite in Playwright's own image, its browsers and their system libraries inside: no
  # apt on the runner, whose mirror has held a run up to 17 minutes (https://playwright.dev/docs/ci).
  # The tag follows @playwright/test (renovate.json, group "playwright").
  e2e-web:
    name: E2E web (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble@sha256:eff16c30e6f3f4af0a03fa4b706120d5e9b0891c344a27d64559aff5900a4a27
      options: --user 1001
    # The suite runs the built server on its own database (tooling/playwright-web).
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # setup-bun unpacks with unzip, which the image lacks; npm is one of Bun's own installs
      # (https://bun.com/docs/installation), at the version package.json pins.
      - name: Install Bun
        run: |
          npm install --global --prefix "$HOME/.local" --no-fund --no-audit "$(node -p "require('./package.json').packageManager")"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      - run: bunx --no-install turbo run test:e2e --filter=@repo/playwright-web ${AFFECTED:+"$AFFECTED"}
        env:
          E2E_DATABASE_URL: postgresql://postgres:postgres@postgres:5432/tom_e2e
      - name: Keep the suite's report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-web-report
          path: tooling/playwright-web/playwright-report/
          retention-days: 7

  # The landing's suite stays on the runner: its server is Caddy, started by `docker run`
  # (apps/landing/playwright.config.ts). Chromium's headless shell only, the one browser it uses.
  e2e-landing:
    name: E2E landing (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-monorepo
      - name: Is the landing affected
        id: affected
        run: |
          TASKS=$(bunx --no-install turbo run test:e2e --filter=landing ${AFFECTED:+"$AFFECTED"} --dry=json | jq '[.tasks[] | select(.command != "<NONEXISTENT>")] | length')
          echo "run=$([ "$TASKS" -gt 0 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - name: Install Chromium's headless shell and its system dependencies
        if: steps.affected.outputs.run == 'true'
        working-directory: apps/landing
        run: bunx --no-install playwright install --with-deps --only-shell chromium
      - if: steps.affected.outputs.run == 'true'
        run: bunx --no-install turbo run test:e2e --filter=landing

  migrations:
    name: Migration Sync
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-monorepo
      - name: The committed SQL matches the schema
        working-directory: apps/server
        run: |
          bun run db:generate
          if [ -n "$(git status --porcelain drizzle/)" ]; then
            echo "::error::Schema and migrations out of sync: run 'bun run db:generate' in apps/server and commit drizzle/."
            git status --porcelain drizzle/
            exit 1
          fi

  # The image is built once, run against Postgres, and published by its commit on main.
  image:
    name: Server image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.publish.outputs.image }}
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/tomai-server
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build
        run: |
          IMAGE="${IMAGE,,}"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"
          docker build --target production -t "$IMAGE:$GITHUB_SHA" -f apps/server/Dockerfile .
      # NODE_ENV=test: the service's Postgres has no TLS, which production requires.
      - name: Run against Postgres
        run: |
          docker run -d --name server --network host \
            -e NODE_ENV=test -e PORT=3000 -e LOG_LEVEL=warn \
            -e DATABASE_URL=postgresql://postgres:postgres@localhost:5432/postgres \
            -e BETTER_AUTH_SECRET="$(openssl rand -base64 32)" -e BETTER_AUTH_URL=http://localhost:3000 \
            "$IMAGE:$GITHUB_SHA"
          # The image's HEALTHCHECK, then readiness: migrations applied, database reachable.
          for _ in $(seq 1 60); do
            if [ "$(docker inspect -f '{{.State.Health.Status}}' server)" = healthy ] &&
              curl -sf http://localhost:3000/health/ready; then echo; exit 0; fi
            sleep 1
          done
          docker inspect -f '{{json .State.Health}}' server
          docker logs server
          exit 1
      - name: Publish
        id: publish
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$GITHUB_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker push "$IMAGE:$GITHUB_SHA"
          echo "image=$(docker inspect -f '{{index .RepoDigests 0}}' "$IMAGE:$GITHUB_SHA")" >> "$GITHUB_OUTPUT"

  secrets:
    name: Secret Detection
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  sast:
    name: SAST
    runs-on: ubuntu-latest
    timeout-minutes: 10
    container:
      image: semgrep/semgrep@sha256:acaac22ffc7b7cc5926de0751b223bce0b2491c33d18422fa72f632c78d81198 # 1.177.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: semgrep ci
        env:
          SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}

  audit:
    name: Dependency audit (prod, high+)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-monorepo
      - run: bun audit --audit-level=high --prod

  # The one required check. A job that needs another is skipped when that one fails, unless
  # always() runs it (https://docs.github.com/en/actions/how-tos/write-workflows/choose-what-workflows-do/use-jobs):
  # it fails on any result but success.
  ci-ok:
    name: ci-ok
    if: always()
    needs: [check, actionlint, test, build, e2e-web, e2e-landing, migrations, image, secrets, sast, audit]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every job succeeded
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "results: $RESULTS"
          for result in $RESULTS; do
            if [ "$result" != "success" ]; then exit 1; fi
          done

  # The staging takes every merge on main once everything passed: the image the CI built and ran,
  # by its digest. Clever Cloud only pulls it, nothing is built there, so no secret reaches a build
  # (docs/architecture.md, « Environnements et livraison »). The keys are the staging environment's.
  deploy-staging:
    name: Deploy staging
    needs: [ci-ok, image]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: staging
      url: https://staging.tomia.fr
    concurrency:
      group: deploy-staging
      cancel-in-progress: false
    env:
      CLEVER_TOKEN: ${{ secrets.CLEVER_TOKEN }}
      CLEVER_SECRET: ${{ secrets.CLEVER_SECRET }}
      APP_ID: app_d529cc6c-ffcb-4cf4-9aef-09c68f93b42f
      IMAGE: ${{ needs.image.outputs.image }}
    steps:
      - name: Deploy the image
        run: |
          # Two merges close together can finish their CI out of order: only main's head deploys,
          # so that an older image never replaces a newer one.
          head="$(git ls-remote "https://github.com/$GITHUB_REPOSITORY" refs/heads/main | cut -f1)"
          if [ "$head" != "$GITHUB_SHA" ]; then
            echo "::notice::$GITHUB_SHA is no longer main's head ($head): the run of the head deploys"
            exit 0
          fi
          mkdir release && cd release
          echo "FROM $IMAGE" > Dockerfile
          git init -q
          git add Dockerfile
          git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -qm "$GITHUB_SHA"
          npx --yes clever-tools@5.1.0 link "$APP_ID"
          npx --yes clever-tools@5.1.0 deploy --force
