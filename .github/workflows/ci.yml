# One pipeline: every check of the repository, in parallel jobs, gathered by `ci-ok`, the one
# check the ruleset requires. On a PR, turbo `--affected` picks the tasks; on main, all run.
# Actions pinned by SHA.

name: CI

# No paths-ignore: `ci-ok` must report on every PR, or the ruleset blocks its merge, and every
# commit on main gets its image. Every PR, whatever its base: in a cascade, each PR targets the
# branch before it, and the run on its head still counts once it is retargeted on main.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A new push cancels a PR's run; on main, each merge's run goes on to publish its image.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  TURBO_SCM_BASE: origin/main
  # The PR runs what it affects, main runs everything.
  AFFECTED: ${{ github.event_name == 'pull_request' && '--affected' || '' }}

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-monorepo
        with:
          turbo-cache-key: check
      - run: bunx --no-install turbo run typecheck lint ${AFFECTED:+"$AFFECTED"}
      - run: bunx --no-install prettier --check .
      - run: bunx --no-install knip
      # Version-pinned, as its README asks (https://github.com/QuiiBz/sherif).
      - run: npx sherif@1.13.0

  actionlint:
    name: Actionlint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Docker image method of https://github.com/rhysd/actionlint/blob/main/docs/usage.md.
      - uses: docker://rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
        with:
          args: -color

  test:
    name: Test
    runs-on: ubuntu-latest
    # The server's tests run on a real Postgres: a database per test file, copied from this run's
    # template (apps/server/src/testing).
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-monorepo
        with:
          turbo-cache-key: test
      - run: bunx --no-install turbo run test ${AFFECTED:+"$AFFECTED"}
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-monorepo
        with:
          turbo-cache-key: build
      - run: bunx --no-install turbo run build ${AFFECTED:+"$AFFECTED"}

  # Browsers are installed, not cached: https://playwright.dev/docs/ci#caching-browsers
  # (restoring takes as long as downloading, and the system dependencies are not cacheable).
  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # The web's suite runs the built server on its own database (tooling/playwright-web).
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-monorepo
        with:
          turbo-cache-key: e2e
      - name: List the e2e tasks to run
        id: tasks
        run: |
          TASKS=$(bunx --no-install turbo run test:e2e ${AFFECTED:+"$AFFECTED"} --dry=json | jq -r '[.tasks[] | select(.command != "<NONEXISTENT>") | .taskId] | join(" ")')
          echo "tasks=$TASKS" >> "$GITHUB_OUTPUT"
          echo "e2e tasks: ${TASKS:-none}"
      # The web's suite runs on WebKit (iphone) and Chromium (android), the landing's on Chromium.
      - name: Install browsers and their system dependencies
        if: steps.tasks.outputs.tasks != ''
        working-directory: tooling/playwright-web
        run: bunx --no-install playwright install --with-deps chromium webkit
      - name: Run e2e
        if: steps.tasks.outputs.tasks != ''
        run: bunx --no-install turbo run test:e2e ${AFFECTED:+"$AFFECTED"}
        env:
          E2E_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/tom_e2e
      - name: Keep the web suite's report
        if: failure() && steps.tasks.outputs.tasks != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-web-report
          path: tooling/playwright-web/playwright-report/
          retention-days: 7

  migrations:
    name: Migration Sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-monorepo
        with:
          turbo-cache-key: migrations
      - name: The committed SQL matches the schema
        working-directory: apps/server
        run: |
          bun run db:generate
          if [ -n "$(git status --porcelain drizzle/)" ]; then
            echo "::error::Schema and migrations out of sync: run 'bun run db:generate' in apps/server and commit drizzle/."
            git status --porcelain drizzle/
            exit 1
          fi

  # The image is built once, run against Postgres, and published by its commit on main.
  image:
    name: Server image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/tomai-server
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build
        run: |
          IMAGE="${IMAGE,,}"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"
          docker build --target production -t "$IMAGE:$GITHUB_SHA" -f apps/server/Dockerfile .
      # NODE_ENV=test: the service's Postgres has no TLS, which production requires.
      - name: Run against Postgres
        run: |
          docker run -d --name server --network host \
            -e NODE_ENV=test -e PORT=3000 -e LOG_LEVEL=warn \
            -e DATABASE_URL=postgresql://postgres:postgres@localhost:5432/postgres \
            -e BETTER_AUTH_SECRET="$(openssl rand -base64 32)" -e BETTER_AUTH_URL=http://localhost:3000 \
            "$IMAGE:$GITHUB_SHA"
          # The image's HEALTHCHECK, then readiness: migrations applied, database reachable.
          for _ in $(seq 1 60); do
            if [ "$(docker inspect -f '{{.State.Health.Status}}' server)" = healthy ] &&
              curl -sf http://localhost:3000/health/ready; then echo; exit 0; fi
            sleep 1
          done
          docker inspect -f '{{json .State.Health}}' server
          docker logs server
          exit 1
      - name: Publish
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$GITHUB_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker push "$IMAGE:$GITHUB_SHA"

  secrets:
    name: Secret Detection
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  sast:
    name: SAST
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep@sha256:acaac22ffc7b7cc5926de0751b223bce0b2491c33d18422fa72f632c78d81198 # 1.177.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: semgrep ci
        env:
          SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}

  audit:
    name: Dependency audit (prod, high+)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-monorepo
        with:
          turbo-cache-key: audit
      - run: bun audit --audit-level=high --prod

  # The one required check. A job that needs another is skipped when that one fails, unless
  # always() runs it (https://docs.github.com/en/actions/how-tos/write-workflows/choose-what-workflows-do/use-jobs):
  # it fails on any result but success.
  ci-ok:
    name: ci-ok
    if: always()
    needs: [check, actionlint, test, build, e2e, migrations, image, secrets, sast, audit]
    runs-on: ubuntu-latest
    steps:
      - name: Every job succeeded
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "results: $RESULTS"
          for result in $RESULTS; do
            if [ "$result" != "success" ]; then exit 1; fi
          done
