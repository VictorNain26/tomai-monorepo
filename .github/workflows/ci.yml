# TomAI Monorepo - CI Pipeline
# Turborepo --affected filtering, remote cache, parallelized, SHA-pinned

name: CI

on:
  push:
    branches: [main, staging]
    paths-ignore:
      - 'docs/**/*.md'
      - 'README.md'
      - '.vscode/**'
      - 'LICENSE'
  pull_request:
    branches: [main, staging]
    paths-ignore:
      - 'docs/**/*.md'
      - 'README.md'
      - '.vscode/**'
      - 'LICENSE'

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: ${{ secrets.TURBO_TEAM }}
  TURBO_SCM_BASE: origin/main

jobs:
  # =============================================
  # Job 1: Typecheck + Lint (parallel matrix)
  # =============================================
  validate-tasks:
    name: ${{ matrix.task }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        task: [typecheck, lint]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-monorepo
        with:
          turbo-cache-key: ${{ matrix.task }}
      - name: Run ${{ matrix.task }}
        run: |
          if [ "${{ github.event_name }}" = "push" ] && [ "${{ github.ref }}" = "refs/heads/main" ]; then
            pnpm turbo run ${{ matrix.task }}
          else
            pnpm turbo run ${{ matrix.task }} --affected
          fi

  # =============================================
  # Job 1b: Required status check gate
  # =============================================
  validate:
    name: Validate
    needs: validate-tasks
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check results
        run: |
          if [ "${{ needs.validate-tasks.result }}" = "failure" ]; then
            exit 1
          fi

  # =============================================
  # Job 2: Tests (after validate passes)
  # =============================================
  test:
    name: Test
    needs: validate-tasks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-monorepo
        with:
          turbo-cache-key: test
      - name: Run tests
        run: |
          if [ "${{ github.event_name }}" = "push" ] && [ "${{ github.ref }}" = "refs/heads/main" ]; then
            pnpm turbo run test
          else
            pnpm turbo run test --affected
          fi
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL || 'postgresql://localhost:5432/test' }}
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET || 'ci-test-secret-not-for-production' }}

  # =============================================
  # Job 3: Build (after validate passes)
  # =============================================
  build:
    name: Build
    needs: validate-tasks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-monorepo
        with:
          turbo-cache-key: build
      - name: Run build
        run: |
          if [ "${{ github.event_name }}" = "push" ] && [ "${{ github.ref }}" = "refs/heads/main" ]; then
            pnpm turbo run build
          else
            pnpm turbo run build --affected
          fi

  # =============================================
  # Job 4: Migration sync (server DB schema only)
  # =============================================
  migrations:
    name: Migration Sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
      - name: Check if server DB schema changed
        id: check
        run: |
          if [ -n "$GITHUB_BASE_REF" ]; then
            DIFF=$(git diff --name-only "origin/$GITHUB_BASE_REF"...HEAD -- 'apps/server/src/db/' 'apps/server/drizzle.config.ts')
          else
            DIFF=$(git diff --name-only "${{ github.event.before }}" "${{ github.sha }}" -- 'apps/server/src/db/' 'apps/server/drizzle.config.ts')
          fi
          if [ -n "$DIFF" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Schema files changed:"
            echo "$DIFF"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No schema changes detected"
          fi
      - uses: ./.github/actions/setup-monorepo
        if: steps.check.outputs.changed == 'true'
        with:
          turbo-cache-key: migrations
      - name: Check migrations in sync with schema
        if: steps.check.outputs.changed == 'true'
        working-directory: apps/server
        run: |
          bun run db:generate
          if [ -n "$(git diff --name-only drizzle/)" ]; then
            echo "::error::Schema et migrations desynchronises ! Execute 'cd apps/server && bun run db:generate' puis commite les fichiers generes."
            git diff drizzle/
            exit 1
          fi
          echo "Migrations en sync avec schema.ts"

