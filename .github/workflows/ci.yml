# TomAI Monorepo - CI Pipeline
# Turborepo --affected filtering, remote cache, parallelized, SHA-pinned

name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**/*.md'
      - 'README.md'
      - '.vscode/**'
      - 'LICENSE'
  # No paths-ignore here: the required checks (typecheck/lint/Test/Build) must
  # report on every PR or the branch ruleset blocks merges for config/docs-only
  # PRs. Turbo `--affected` makes those runs fast no-ops (0 affected packages).
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  TURBO_SCM_BASE: origin/main

jobs:
  # =============================================
  # Job 1: Typecheck + Lint (parallel matrix)
  # =============================================
  validate-tasks:
    name: ${{ matrix.task }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        task: [typecheck, lint]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-monorepo
        with:
          turbo-cache-key: ${{ matrix.task }}
      - name: Run ${{ matrix.task }}
        run: |
          if [ "${{ github.event_name }}" = "push" ] && [ "${{ github.ref }}" = "refs/heads/main" ]; then
            bunx --no-install turbo run ${{ matrix.task }}
          else
            bunx --no-install turbo run ${{ matrix.task }} --affected
          fi
      # Repo-wide and fast, so not filtered by --affected.
      - name: Check formatting (Prettier)
        if: matrix.task == 'lint'
        run: bunx --no-install prettier --check .

  # Root scripts: no database and no install needed, bun runs their tests.
  script-tests:
    name: Script tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - run: bun run test:scripts

  # =============================================
  # Job 1b: Required status check gate
  # =============================================
  validate:
    name: Validate
    needs: validate-tasks
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check results
        env:
          RESULT: ${{ needs.validate-tasks.result }}
        run: |
          if [ "$RESULT" != "success" ]; then
            echo "validate-tasks finished with result: $RESULT"
            exit 1
          fi

  # =============================================
  # Job 2: Tests (after validate passes)
  # =============================================
  test:
    name: Test
    needs: validate-tasks
    runs-on: ubuntu-latest
    # Ephemeral Postgres service so DB-backed integration tests actually RUN
    # in CI instead of skipping on an unreachable DB. Deterministic + isolated.
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-monorepo
        with:
          turbo-cache-key: test
      - name: Run tests
        run: |
          if [ "${{ github.event_name }}" = "push" ] && [ "${{ github.ref }}" = "refs/heads/main" ]; then
            bunx --no-install turbo run test
          else
            bunx --no-install turbo run test --affected
          fi
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET || 'ci-test-secret-not-for-production' }}
      # The runner starts steps once the postgres service is healthy.
      - name: Prepare integration DB (migrations)
        run: cd apps/server && bun run db:migrate
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET || 'ci-test-secret-not-for-production' }}
      - name: Server integration tests
        run: cd apps/server && bun run test:integration
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET || 'ci-test-secret-not-for-production' }}

  # =============================================
  # Job 3: Build (after validate passes)
  # =============================================
  build:
    name: Build
    needs: validate-tasks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-monorepo
        with:
          turbo-cache-key: build
      - name: Run build
        run: |
          if [ "${{ github.event_name }}" = "push" ] && [ "${{ github.ref }}" = "refs/heads/main" ]; then
            bunx --no-install turbo run build
          else
            bunx --no-install turbo run build --affected
          fi

  # =============================================
  # Job 3b: End-to-end (Playwright)
  # =============================================
  # Browsers are installed, not cached: https://playwright.dev/docs/ci#caching-browsers
  # (restoring takes as long as downloading, and the system dependencies are not cacheable).
  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # Cheap check before the install: a PR that touches neither the apps under test, the
      # packages they use, the server that serves the web, nor the tooling skips the job's setup.
      - name: Check whether the e2e suites are concerned
        id: scope
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          elif git diff --name-only "origin/${{ github.base_ref }}...HEAD" | grep -qE '^(apps/(web|landing|server)/|packages/|bun\.lock$|package\.json$|turbo\.json$|\.github/)'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: ./.github/actions/setup-monorepo
        if: steps.scope.outputs.run == 'true'
        with:
          turbo-cache-key: e2e
      - name: List e2e tasks to run
        if: steps.scope.outputs.run == 'true'
        id: tasks
        run: |
          if [ "${{ github.event_name }}" = "push" ] && [ "${{ github.ref }}" = "refs/heads/main" ]; then
            AFFECTED=""
          # web's e2e run on the server's own serving (web#test:e2e inputs in turbo.json), files
          # outside apps/web that --affected, package by package, never maps to web.
          elif git diff --name-only "origin/${{ github.base_ref }}...HEAD" | grep -qE '^apps/server/(scripts/serve-web|src/platform/http/(security-headers|web-client))\.ts$'; then
            AFFECTED=""
          else
            AFFECTED="--affected"
          fi
          echo "affected=$AFFECTED" >> "$GITHUB_OUTPUT"
          TASKS=$(bunx --no-install turbo run test:e2e $AFFECTED --dry=json | jq -r '[.tasks[] | select(.command != "<NONEXISTENT>") | .taskId] | join(" ")')
          echo "tasks=$TASKS" >> "$GITHUB_OUTPUT"
          echo "e2e tasks: ${TASKS:-none}"
      # web runs on WebKit (iphone) and Chromium (android), the landing on Chromium.
      - name: Install browsers and their system dependencies
        if: steps.tasks.outputs.tasks != ''
        working-directory: apps/web
        run: bunx --no-install playwright install --with-deps chromium webkit
      - name: Run e2e
        if: steps.tasks.outputs.tasks != ''
        run: bunx --no-install turbo run test:e2e ${{ steps.tasks.outputs.affected }}

  # =============================================
  # Job 4: Migration sync (server DB schema only)
  # =============================================
  migrations:
    name: Migration Sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # drizzle/ counts too: a snapshot or journal changed without the schema desyncs them as well.
      - name: Check if server DB schema or migrations changed
        id: check
        run: |
          if [ -n "$GITHUB_BASE_REF" ]; then
            DIFF=$(git diff --name-only "origin/$GITHUB_BASE_REF"...HEAD -- 'apps/server/src/db/' ':(glob)apps/server/src/**/*.schema.ts' 'apps/server/drizzle.config.ts' 'apps/server/drizzle/')
          else
            DIFF=$(git diff --name-only "${{ github.event.before }}" "${{ github.sha }}" -- 'apps/server/src/db/' ':(glob)apps/server/src/**/*.schema.ts' 'apps/server/drizzle.config.ts' 'apps/server/drizzle/')
          fi
          if [ -n "$DIFF" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Schema or migration files changed:"
            echo "$DIFF"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No schema or migration changes detected"
          fi
      - uses: ./.github/actions/setup-monorepo
        if: steps.check.outputs.changed == 'true'
        with:
          turbo-cache-key: migrations
      - name: Check migrations in sync with schema
        if: steps.check.outputs.changed == 'true'
        working-directory: apps/server
        run: |
          bun run db:generate
          if [ -n "$(git diff --name-only drizzle/)" ]; then
            echo "::error::Schema et migrations desynchronises ! Execute 'cd apps/server && bun run db:generate' puis commite les fichiers generes."
            git diff drizzle/
            exit 1
          fi
          echo "Migrations en sync avec schema.ts"

  # =============================================
  # Job 5: Dead code (knip)
  # =============================================
  # Cross-cutting (spans every workspace), so no paths filter — runs on every PR.
  dead-code:
    name: Dead code (knip)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-monorepo
        with:
          turbo-cache-key: knip
      - name: Run knip
        run: bunx --no-install knip

  # =============================================
  # Job 6: Monorepo lint (sherif)
  # =============================================
  # Version-pinned per https://github.com/QuiiBz/sherif README ("Run it by
  # specifying a version instead of latest") to avoid CI drift on new releases.
  # Reads the workspaces of the root package.json, no install needed — just Node/npx.
  monorepo-lint:
    name: Monorepo lint (sherif)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - name: Run sherif
        run: npx sherif@1.13.0
