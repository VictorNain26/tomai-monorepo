# TomAI Monorepo - CI Pipeline
# Turborepo --affected filtering, remote cache, parallelized, SHA-pinned

name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**/*.md'
      - 'README.md'
      - '.vscode/**'
      - 'LICENSE'
  # No paths-ignore here: the required checks (typecheck/lint/Test/Build) must
  # report on every PR or the branch ruleset blocks merges for config/docs-only
  # PRs. Turbo `--affected` makes those runs fast no-ops (0 affected packages).
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: ${{ secrets.TURBO_TEAM }}
  TURBO_SCM_BASE: origin/main

jobs:
  # =============================================
  # Job 1: Typecheck + Lint (parallel matrix)
  # =============================================
  validate-tasks:
    name: ${{ matrix.task }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        task: [typecheck, lint]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-monorepo
        with:
          turbo-cache-key: ${{ matrix.task }}
      - name: Run ${{ matrix.task }}
        run: |
          if [ "${{ github.event_name }}" = "push" ] && [ "${{ github.ref }}" = "refs/heads/main" ]; then
            pnpm turbo run ${{ matrix.task }}
          else
            pnpm turbo run ${{ matrix.task }} --affected
          fi

  # =============================================
  # Job 1b: Required status check gate
  # =============================================
  validate:
    name: Validate
    needs: validate-tasks
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check results
        run: |
          if [ "${{ needs.validate-tasks.result }}" = "failure" ]; then
            exit 1
          fi

  # =============================================
  # Job 2: Tests (after validate passes)
  # =============================================
  test:
    name: Test
    needs: validate-tasks
    runs-on: ubuntu-latest
    # Ephemeral pgvector service so DB-backed integration tests (incl. the
    # Pronote onboarding e2e: discover -> activate -> getGrades) actually RUN
    # in CI instead of skipping on an unreachable DB. Deterministic + isolated.
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-monorepo
        with:
          turbo-cache-key: test
      - name: Run tests
        run: |
          if [ "${{ github.event_name }}" = "push" ] && [ "${{ github.ref }}" = "refs/heads/main" ]; then
            pnpm turbo run test
          else
            pnpm turbo run test --affected
          fi
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET || 'ci-test-secret-not-for-production' }}
      - name: Prepare integration DB (pgvector extension + migrations)
        run: |
          until pg_isready -h localhost -U postgres; do echo "waiting for postgres..."; sleep 1; done
          PGPASSWORD=postgres psql -h localhost -U postgres -d test -c "CREATE EXTENSION IF NOT EXISTS vector;"
          cd apps/server && bun run db:migrate
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET || 'ci-test-secret-not-for-production' }}
      - name: Server integration tests
        run: cd apps/server && bun run test:integration
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET || 'ci-test-secret-not-for-production' }}
      - name: Server test coverage (report only)
        run: cd apps/server && bun run test:coverage
        continue-on-error: true
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET || 'ci-test-secret-not-for-production' }}

  # =============================================
  # Job 3: Build (after validate passes)
  # =============================================
  build:
    name: Build
    needs: validate-tasks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-monorepo
        with:
          turbo-cache-key: build
      - name: Run build
        run: |
          if [ "${{ github.event_name }}" = "push" ] && [ "${{ github.ref }}" = "refs/heads/main" ]; then
            pnpm turbo run build
          else
            pnpm turbo run build --affected
          fi

  # =============================================
  # Job 4: Migration sync (server DB schema only)
  # =============================================
  migrations:
    name: Migration Sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Check if server DB schema changed
        id: check
        run: |
          if [ -n "$GITHUB_BASE_REF" ]; then
            DIFF=$(git diff --name-only "origin/$GITHUB_BASE_REF"...HEAD -- 'apps/server/src/db/' 'apps/server/drizzle.config.ts')
          else
            DIFF=$(git diff --name-only "${{ github.event.before }}" "${{ github.sha }}" -- 'apps/server/src/db/' 'apps/server/drizzle.config.ts')
          fi
          if [ -n "$DIFF" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Schema files changed:"
            echo "$DIFF"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No schema changes detected"
          fi
      - uses: ./.github/actions/setup-monorepo
        if: steps.check.outputs.changed == 'true'
        with:
          turbo-cache-key: migrations
      - name: Check migrations in sync with schema
        if: steps.check.outputs.changed == 'true'
        working-directory: apps/server
        run: |
          bun run db:generate
          if [ -n "$(git diff --name-only drizzle/)" ]; then
            echo "::error::Schema et migrations desynchronises ! Execute 'cd apps/server && bun run db:generate' puis commite les fichiers generes."
            git diff drizzle/
            exit 1
          fi
          echo "Migrations en sync avec schema.ts"

  # =============================================
  # Job 5: Dead code (knip)
  # =============================================
  # Cross-cutting (spans every workspace), so no paths filter — runs on every PR.
  dead-code:
    name: Dead code (knip)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-monorepo
        with:
          turbo-cache-key: knip
      - name: Run knip
        run: pnpm exec knip

  # =============================================
  # Job 6: Monorepo lint (sherif)
  # =============================================
  # Version-pinned per https://github.com/QuiiBz/sherif README ("Run it by
  # specifying a version instead of latest") to avoid CI drift on new releases.
  # Reads pnpm-workspace.yaml directly, no install needed — just Node/npx.
  monorepo-lint:
    name: Monorepo lint (sherif)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - name: Run sherif
        run: npx sherif@1.13.0
