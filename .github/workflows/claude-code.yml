# Claude Code - AI agent for issues and PR reviews
# Triggers on "claude" label or @claude mentions

name: Claude Code

on:
  issues:
    types: [labeled]
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  claude:
    name: Claude Code
    runs-on: ubuntu-latest
    if: |
      (github.event_name == 'issues' && github.event.label.name == 'claude' && (github.event.issue.author_association == 'OWNER' || github.event.issue.author_association == 'MEMBER' || github.event.issue.author_association == 'COLLABORATOR')) ||
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude') && (github.event.comment.author_association == 'OWNER' || github.event.comment.author_association == 'MEMBER' || github.event.comment.author_association == 'COLLABORATOR'))
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup-monorepo

      - uses: anthropics/claude-code-action@cfc3eb22bfed5c26ef66e3223c982af27e4524de # v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          model: claude-sonnet-4-6
          max_turns: 25
          allowed_tools: |
            Bash(pnpm typecheck)
            Bash(pnpm lint)
            Bash(pnpm test)
            Bash(pnpm build)
            Bash(bun test)
            Bash(bun run typecheck)
            Bash(bun run lint)
            Bash(bun run db:generate)
            Bash(bun run db:check)
            Bash(git status)
            Bash(git diff)
            Bash(git log)
            Bash(ls)
            Read
            Edit
            Write
            Glob
            Grep
