# Self-hosted Renovate runner
# Optional fallback if the GitHub App (https://github.com/apps/renovate) is not installed.
# Skip this workflow once the App is enabled — the App runs Renovate on its own infra.
#
# Required secrets when self-hosting:
#   RENOVATE_TOKEN  - PAT (or GitHub App token) with repo + workflow scopes on this repo
#
# Schedule mirrors the renovate.json schedule (Monday morning, Europe/Paris).

name: Renovate

on:
  schedule:
    # 07:00 UTC Monday = 09:00 Europe/Paris (08:00 in winter)
    - cron: "0 7 * * 1"
  workflow_dispatch:
    inputs:
      logLevel:
        description: "Renovate log level"
        required: false
        default: "info"
        type: choice
        options: [info, debug, trace]
      dryRun:
        description: "Dry-run (no PRs created)"
        required: false
        default: "false"
        type: choice
        options: ["false", "true"]

permissions:
  contents: read

concurrency:
  group: renovate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-config:
    name: Validate config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - name: Validate renovate.json
        run: npx -y --package=renovate -- renovate-config-validator --strict .github/renovate.json

  renovate:
    name: Run Renovate
    needs: validate-config
    runs-on: ubuntu-latest
    if: ${{ secrets.RENOVATE_TOKEN != '' }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Self-hosted Renovate
        uses: renovatebot/github-action@e084b5ac6fd201023db6dd7eb6f3c7ca9e9c8513 # v43.0.4
        with:
          configurationFile: .github/renovate.json
          token: ${{ secrets.RENOVATE_TOKEN }}
        env:
          LOG_LEVEL: ${{ inputs.logLevel || 'info' }}
          RENOVATE_DRY_RUN: ${{ inputs.dryRun == 'true' && 'full' || '' }}
          RENOVATE_AUTODISCOVER: "false"
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          RENOVATE_PLATFORM: github
