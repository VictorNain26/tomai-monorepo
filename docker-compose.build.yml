# Override EXPLICITE pour builder ai-service en local (contributeurs du service).
# Le compose principal pull l'image depuis GHCR ; ce fichier réactive le build.
#
# Build local :   docker compose -f docker-compose.yml -f docker-compose.build.yml build ai-service
# Up avec build : docker compose -f docker-compose.yml -f docker-compose.build.yml up -d ai-service
services:
  ai-service:
    build:
      context: ./apps/ai-service
      dockerfile: Dockerfile
    pull_policy: build
