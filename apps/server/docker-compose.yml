# ============================================================
# TomAI Backend - Docker Compose Development (2025)
# Usage: docker compose up -d
# Tools: docker compose --profile tools up -d
# ============================================================

services:
  # ===========================================
  # Backend TomAI - Development avec hot-reload
  # ===========================================
  backend:
    build:
      context: ../..
      dockerfile: apps/server/Dockerfile
      target: development
    container_name: tomai-backend-dev
    ports:
      - "3000:3000"
    environment:
      # Core
      - NODE_ENV=development
      - PORT=3000
      - LOG_LEVEL=debug
      - DOCKER_CONTAINER=true
      # Database (internal Docker network)
      - DATABASE_URL=postgresql://tomai_dev:tomai_dev_password@postgres:5432/tomai_dev
      # CORS
      - CORS_ORIGINS=http://localhost:3001
      # Auth (REQUIRED)
      - BETTER_AUTH_SECRET=${BETTER_AUTH_SECRET}
      - BETTER_AUTH_URL=http://localhost:3000
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      # AI Services
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - MISTRAL_API_KEY=${MISTRAL_API_KEY}
      # RAG - Qdrant Cloud
      - QDRANT_URL=${QDRANT_URL}
      - QDRANT_API_KEY=${QDRANT_API_KEY}
      - QDRANT_COLLECTION=${QDRANT_COLLECTION:-tomai_educational}
      # AI Service (BGE-M3 embed + bge-reranker-v2-m3) — local dev
      - AI_SERVICE_URL=http://ai-service:8000
      - AI_SERVICE_TOKEN=${AI_SERVICE_TOKEN:-}
      # Pronote Integration (AES-256-GCM encryption)
      - PRONOTE_ENCRYPTION_KEY=${PRONOTE_ENCRYPTION_KEY}
      # RevenueCat webhook shared secret (sent as Authorization header)
      - REVENUECAT_WEBHOOK_AUTH=${REVENUECAT_WEBHOOK_AUTH}
    env_file:
      - .env
    volumes:
      # Hot-reload: mount sources avec paths corrects (monorepo context)
      - ./src:/app/apps/server/src:ro
      - ./drizzle:/app/apps/server/drizzle:ro
      - ./scripts:/app/apps/server/scripts:ro
      - ./tsconfig.json:/app/apps/server/tsconfig.json:ro
      - ./drizzle.config.ts:/app/apps/server/drizzle.config.ts:ro
    depends_on:
      postgres:
        condition: service_healthy
      ai-service:
        condition: service_healthy
    networks:
      - tomai-dev
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1GB
          cpus: '2.0'
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # ===========================================
  # tomai-ai-service — BGE-M3 dense+sparse + bge-reranker-v2-m3
  # Doc : apps/ai-service/README.md
  # ===========================================
  ai-service:
    build:
      context: ../ai-service
      dockerfile: Dockerfile
    container_name: tomai-ai-service-dev
    ports:
      - "8001:8000"  # 8001 côté host pour éviter collision avec backend
    environment:
      - EMBED_MODEL=BAAI/bge-m3
      - RERANK_MODEL=BAAI/bge-reranker-v2-m3
      - USE_FP16=auto
      - HF_HOME=/data/hf_cache
      - PORT=8000
      - API_TOKEN=${AI_SERVICE_TOKEN:-}
    volumes:
      # Cache HF persistant : évite re-download ~3.5 GB à chaque restart
      - ai_service_hf_cache:/data/hf_cache
    networks:
      - tomai-dev
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 6GB  # marge confortable pour FP32 BGE-M3 + bge-reranker
          cpus: '2.0'
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 180s  # cold start = download + load modèles (~30-60s)

  # ===========================================
  # PostgreSQL 16 + pgvector
  # ===========================================
  postgres:
    image: pgvector/pgvector:pg16
    container_name: tomai-postgres-dev
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: tomai_dev
      POSTGRES_USER: tomai_dev
      POSTGRES_PASSWORD: tomai_dev_password
      # Performance tuning for dev
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    networks:
      - tomai-dev
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tomai_dev -d tomai_dev"]
      interval: 10s
      timeout: 5s
      retries: 5
    # Performance config pour dev local
    command: >
      postgres
      -c shared_buffers=256MB
      -c effective_cache_size=512MB
      -c max_connections=100

  # ===========================================
  # Outils optionnels (profile: tools)
  # Usage: docker compose --profile tools up -d
  # ===========================================

  # Drizzle Studio - Database UI (port 4983)
  drizzle-studio:
    image: oven/bun:1.3-alpine
    container_name: tomai-drizzle-studio
    working_dir: /app
    ports:
      - "4983:4983"
    environment:
      - DATABASE_URL=postgresql://tomai_dev:tomai_dev_password@postgres:5432/tomai_dev
    volumes:
      - ./drizzle:/app/drizzle:ro
      - ./drizzle.config.ts:/app/drizzle.config.ts:ro
      - ./src/db:/app/src/db:ro
      - ./package.json:/app/package.json:ro
    command: sh -c "bun add drizzle-kit drizzle-orm postgres && bunx drizzle-kit studio --host 0.0.0.0"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - tomai-dev
    profiles:
      - tools

  # Adminer - SQL client léger (port 8080)
  adminer:
    image: adminer:latest
    container_name: tomai-adminer
    ports:
      - "8080:8080"
    environment:
      ADMINER_DEFAULT_SERVER: postgres
      ADMINER_DESIGN: nette
    networks:
      - tomai-dev
    profiles:
      - tools

# ===========================================
# Volumes persistants
# ===========================================
volumes:
  postgres_dev_data:
    name: tomai_postgres_dev_data
  ai_service_hf_cache:
    name: tomai_ai_service_hf_cache

# ===========================================
# Réseau isolé development
# ===========================================
networks:
  tomai-dev:
    name: tomai-dev-network
    driver: bridge
