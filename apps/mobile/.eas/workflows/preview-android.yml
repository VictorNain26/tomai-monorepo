name: Preview Android (Smart Build)

# This workflow uses fingerprinting to avoid unnecessary rebuilds
# It only rebuilds when native code changes, otherwise it just publishes an OTA update

on:
  pull_request:
    branches:
      - main
    paths:
      - apps/mobile/**
      - packages/api/**
      - packages/tokens/**

jobs:
  fingerprint:
    name: Calculate Fingerprint
    type: fingerprint
    environment: preview

  get_existing_build:
    name: Check Existing Build
    needs: [fingerprint]
    type: get-build
    params:
      fingerprint_hash: ${{ needs.fingerprint.outputs.android_fingerprint_hash }}
      platform: android
      profile: preview

  repack:
    name: Repack Existing Build
    needs: [get_existing_build]
    if: ${{ needs.get_existing_build.outputs.build_id }}
    type: repack
    params:
      build_id: ${{ needs.get_existing_build.outputs.build_id }}

  build:
    name: Build Android APK
    needs: [get_existing_build]
    if: ${{ !needs.get_existing_build.outputs.build_id }}
    type: build
    params:
      platform: android
      profile: preview

  update:
    name: Publish OTA Update
    after: [repack, build]
    type: update
    params:
      channel: preview
      platform: android

  e2e:
    name: Run E2E Tests (Maestro)
    after: [repack, build]
    type: maestro
    params:
      build_id: ${{ needs.build.outputs.build_id || needs.repack.outputs.build_id }}
      flow_path: e2e/
