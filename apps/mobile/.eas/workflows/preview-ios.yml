name: Preview iOS (Smart Build)

# This workflow uses fingerprinting to avoid unnecessary rebuilds
# It only rebuilds when native code changes, otherwise it just publishes an OTA update

on:
  push:
    branches:
      - staging
      - feature/*

jobs:
  fingerprint:
    name: Calculate Fingerprint
    type: fingerprint
    environment: preview

  get_existing_build:
    name: Check Existing Build
    needs: [fingerprint]
    type: get-build
    params:
      fingerprint_hash: ${{ needs.fingerprint.outputs.ios_fingerprint_hash }}
      platform: ios
      profile: preview

  repack:
    name: Repack Existing Build
    needs: [get_existing_build]
    if: ${{ needs.get_existing_build.outputs.build_id }}
    type: repack
    params:
      build_id: ${{ needs.get_existing_build.outputs.build_id }}

  build:
    name: Build iOS IPA
    needs: [get_existing_build]
    if: ${{ !needs.get_existing_build.outputs.build_id }}
    type: build
    params:
      platform: ios
      profile: preview

  update:
    name: Publish OTA Update
    after: [repack, build]
    type: update
    params:
      channel: preview
      platform: ios
