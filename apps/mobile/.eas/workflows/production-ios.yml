name: Production iOS (Build & Submit)

# Production workflow: always builds fresh and submits to App Store
# Triggered on main branch pushes or version tags

on:
  push:
    branches:
      - main
    tags:
      - v*

jobs:
  build:
    name: Build iOS IPA
    type: build
    params:
      platform: ios
      profile: production

  submit:
    name: Submit to App Store
    needs: [build]
    type: submit
    params:
      build_id: ${{ needs.build.outputs.build_id }}
