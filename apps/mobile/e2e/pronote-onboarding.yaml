appId: fr.tomia.mobile
---
# Pronote onboarding wizard — E2E flow (preview-android only)
#
# Prerequisites:
#   - Build profile: preview (EXPO_PUBLIC_E2E=1 set in eas.json)
#   - Secrets: E2E_PARENT_EMAIL / E2E_PARENT_PASSWORD (same as auth-parent flow)
#   - Test account must have 0 children so the empty-state CTA is visible
#
# Camera stubbing: EXPO_PUBLIC_E2E=1 causes PronoteQrScanner to render
# a hidden element (testID=e2e-inject-qr) that fires onBarCodeScanned
# with a fixed payload, bypassing the real camera entirely.
#
# API stubbing: usePronoteConnect routes through pronote-e2e-stubs.ts
# (connect/qr → deterministic credentialId; children/get → 1 discovered child;
# activate → activated result) so no live Pronote server is contacted.

# ── 1. Launch fresh ──────────────────────────────────────────────────────────
- launchApp:
    clearState: true

# ── 2. Login as parent (mirrors auth-parent.yaml) ───────────────────────────
- assertVisible: "Tom"
- tapOn:
    id: "login-toggle-parent"
- tapOn:
    id: "login-identifier-input"
- inputText: "${E2E_PARENT_EMAIL}"
- tapOn:
    id: "login-password-input"
- inputText: "${E2E_PARENT_PASSWORD}"
- tapOn:
    id: "login-submit-button"
- extendedWaitUntil:
    visible:
      id: "parent-dashboard"
    timeout: 15000

# ── 3. Open Pronote onboarding wizard ────────────────────────────────────────
- tapOn:
    id: "pronote-connect-cta"
- extendedWaitUntil:
    visible:
      id: "pronote-intro-continue"
    timeout: 5000

# ── 4. Intro step: continue to scan ─────────────────────────────────────────
- tapOn:
    id: "pronote-intro-continue"
- extendedWaitUntil:
    visible:
      id: "e2e-inject-qr"
    timeout: 5000

# ── 5. Inject QR (replaces camera scan) ─────────────────────────────────────
- tapOn:
    id: "e2e-inject-qr"
- extendedWaitUntil:
    visible:
      id: "pronote-pin-input"
    timeout: 5000

# ── 6. Enter PIN and submit ──────────────────────────────────────────────────
- tapOn:
    id: "pronote-pin-input"
- inputText: "0000"
- tapOn:
    id: "pronote-pin-submit"

# ── 7. Wait for discover + select step ──────────────────────────────────────
- extendedWaitUntil:
    visible:
      id: "credentials-username"
    timeout: 10000

# ── 8. Fill child credentials ────────────────────────────────────────────────
- tapOn:
    id: "credentials-username"
- inputText: "demo.eleve"
- tapOn:
    id: "credentials-password"
- inputText: "PasswordDemo1!"

# ── 9. Confirm and activate ──────────────────────────────────────────────────
- tapOn:
    id: "pronote-activate-btn"

# ── 10. Assert success screen visible ────────────────────────────────────────
- extendedWaitUntil:
    visible:
      id: "pronote-onboard-success"
    timeout: 10000
