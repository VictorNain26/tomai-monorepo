appId: fr.tomia.mobile
---
# Login as student
- launchApp:
    clearState: true
- tapOn:
    id: "login-toggle-student"
- tapOn:
    id: "login-identifier-input"
- inputText: "${E2E_STUDENT_USERNAME}"
- tapOn:
    id: "login-password-input"
- inputText: "${E2E_STUDENT_PASSWORD}"
- tapOn:
    id: "login-submit-button"
- extendedWaitUntil:
    visible:
      id: "student-dashboard"
    timeout: 10000

# Navigate to learning tab
- tapOn:
    id: "student-tab-learning"

# Wait for deck list
- extendedWaitUntil:
    visible:
      id: "deck-list"
    timeout: 10000

# Tap first visible deck
- tapOn:
    index: 0
    id: "deck-list"
