[project]
name = "tomai-ai-service"
version = "0.1.0"
description = "HTTP service exposing BGE-M3 (dense+sparse) and bge-reranker-v2-m3 for the Tom RAG backend."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Tom AI" }]

dependencies = [
    # Serveur HTTP — FastAPI standard, mature, type-safe
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    # Modèles ML — libs officielles BAAI / sentence-transformers (cf. choix archi
    # documenté dans docs/ARCHITECTURE.md du curriculum). Aucune dépendance
    # custom : on wrap des libs matures.
    "FlagEmbedding>=1.3",          # BGE-M3 dense + sparse natif (lexical_weights)
    "sentence-transformers>=3.0",  # CrossEncoder pour bge-reranker-v2-m3
    # PyTorch CPU (la version GPU est pull automatiquement si CUDA dispo,
    # mais on cible CPU sur Koyeb eco-large par défaut)
    "torch>=2.5",
    "numpy>=1.26",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.8",
    "pytest>=8.0",
    "httpx>=0.27",  # test client FastAPI
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
