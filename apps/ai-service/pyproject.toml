[project]
name = "tomai-ai-service"
version = "0.1.0"
description = "HTTP service exposing BGE-M3 (dense+sparse) for the Tom RAG backend."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Tom AI" }]

dependencies = [
    # Serveur HTTP — FastAPI standard, mature, type-safe
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    # Modèles ML — lib officielle BAAI FlagEmbedding (cf. choix archi
    # documenté dans docs/ARCHITECTURE.md du curriculum). Aucune dépendance
    # custom : on wrap des libs matures.
    "FlagEmbedding>=1.3",          # BGE-M3 dense + sparse natif (lexical_weights)
    # PyTorch — forcé en CPU via [tool.uv.index] pytorch-cpu (cf. plus bas) :
    # la wheel PyPI par défaut embarque ~6 Go de CUDA inutiles sur Koyeb eco-large.
    "torch>=2.5",
    "numpy>=1.26",
]

[dependency-groups]
dev = [
    "ruff>=0.8",
    "pytest>=8.0",
    "httpx>=0.27",  # test client FastAPI
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.uv]
# inscriptis 2.7.1 pins lxml<6.1.0 but 6.1.0 is the CVE fix (XXE iterparse).
# override-dependencies lets us bypass that upper-bound cap.
override-dependencies = ["lxml>=6.1.1"]

# torch CPU-only : la wheel Linux par défaut embarque CUDA (~6 Go inutiles sur
# Koyeb/dev CPU). On redirige torch vers l'index CPU officiel de PyTorch.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
